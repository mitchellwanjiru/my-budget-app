name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Dependencies
      run: npm install --include=dev

    - name: Build Web Assets
      run: npm run build

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Accept Android SDK Licenses
      run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x android/gradlew

    - name: Copy Assets to Android
      run: npm run cap:copy

    - name: Build Debug APK
      working-directory: ./android
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon 2>&1 | tee ../gradle_build.log

    - name: Report Build Logs
      if: always()
      run: |
        if [ -f gradle_build.log ]; then
          echo "## 📋 Gradle Build Error Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          grep -B 5 -A 40 "What went wrong:" gradle_build.log >> $GITHUB_STEP_SUMMARY || tail -n 120 gradle_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
        fi

    - name: Locate APK files
      run: |
        echo "=== Locating APK ==="
        find android -name "*.apk" || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyBudget-Mpesa-Debug-APK
        path: '**/*.apk'
        if-no-files-found: error
        retention-days: 30
